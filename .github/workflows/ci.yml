name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}, web and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MOVIELENS_HADOOP_RUNTIME: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          python -m pip install setuptools wheel
          python -m pip install --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check web scripts and patch formatting
        run: |
          node --check src/movielens_agent/web/app.js
          node --check src/movielens_agent/web/manage.js
          node --check src/movielens_agent/web/governance.js
          git show --format= --check HEAD
      - name: Run small fixture tests without Hadoop or model credentials
        run: |
          mkdir -p var/ci
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee var/ci/unittest.log
      - name: Build installable application
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/checks/check_wheel.py dist/*.whl
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ github.sha }}-py${{ matrix.python-version }}
          path: var/ci/unittest.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Save application package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: application-${{ github.sha }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
