<path d="M1280,470 L1350,470" fill="none" stroke="#52756b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1280,760 L1350,760" fill="none" stroke="#52756b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1280,950 L1350,950" fill="none" stroke="#52756b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1280,1095 L1350,1095" fill="none" stroke="#52756b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1280,1445 L1350,1445" fill="none" stroke="#52756b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1280,1910 L1350,1910" fill="none" stroke="#ad352c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<text x="945" y="1808" font-size="17" font-weight="400" fill="#ad352c" text-anchor="start">
<tspan x="945" dy="0">文件就绪后核对并登记</tspan>
</text>
<text x="60" y="2080" font-size="19" font-weight="400" fill="#656a62" text-anchor="start">
<tspan x="60" dy="0">中央箭头表示工作流执行顺序，右侧展示关键输出；具体输入在每个作业框中标明。</tspan>
<tspan x="60" dy="32">每个 MapReduce 作业都记录真实 application/job ID。计算中间文件不作为成功产物对外发布。</tspan>
