[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-agent"
version = "0.1.0"
description = "MovieLens agent foundations, durable workflows and Hadoop data governance"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
movielens-agent = "movielens_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
movielens_agent = ["web/*"]
