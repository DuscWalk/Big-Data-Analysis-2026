[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-agent"
version = "0.1.0"
description = "MovieLens agent foundations, durable workflows and Hadoop data governance"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
movielens-agent = "movielens_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
